<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colecciones · Limonada uniformes ejecutivos</title>
    <meta name="description" content="Sacos, pantalones, faldas, vestidos, blusas, camisas y chalecos para dama y caballero. Elige tela y color y agrégalos a tu cotización.">
    <link rel="canonical" href="https://limonada.com.mx/pages/colecciones/">
    <meta property="og:title" content="Colecciones · Limonada uniformes ejecutivos">
    <meta property="og:description" content="Sacos, pantalones, faldas, vestidos, blusas, camisas y chalecos para dama y caballero. Elige tela y color y agrégalos a tu cotización.">
    <meta property="og:url" content="https://limonada.com.mx/pages/colecciones/">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#14213d">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/catalogo.jsx"></script>
    <script type="text/babel">
        const CollectionsPage = () => {
            const catalog = useCatalog();
            const params = new URLSearchParams(window.location.search);
            const [line, setLine] = useState(params.get('linea') || 'all');
            const [type, setType] = useState(params.get('tipo') || 'all');
            const [fabric, setFabric] = useState('all');

            // Keep ?linea= and ?tipo= in the URL so a filtered view can be shared.
            useEffect(() => {
                const url = new URL(window.location);
                line === 'all' ? url.searchParams.delete('linea') : url.searchParams.set('linea', line);
                type === 'all' ? url.searchParams.delete('tipo') : url.searchParams.set('tipo', type);
                history.replaceState(null, '', url);
            }, [line, type]);

            const order = Object.fromEntries(catalog.types.map(t => [t.id, t.sort_order]));
            const inLine = catalog.garments.filter(g => line === 'all' || g.line_id === line);
            const types = catalog.types.filter(t => inLine.some(g => g.type_id === t.id));
            const garments = inLine
                .filter(g => type === 'all' || g.type_id === type)
                .filter(g => fabric === 'all' || g.fabric_ids.includes(fabric))
                .sort((a, b) => a.line_id.localeCompare(b.line_id) || order[a.type_id] - order[b.type_id]);
            const current = catalog.line[line];

            const chip = (active) => `shrink-0 px-4 py-2 rounded-full text-sm border transition-colors ${active ? 'bg-navy text-white border-navy' : 'border-navy-line hover:border-navy'}`;

            return (
                <>
                    <PageHero kicker="Colecciones" title={current ? `Línea` : 'Todas las'} mark={current ? current.label : 'prendas'}
                        intro={current ? current.description : 'Elige prendas, telas y colores y agrégalas a tu cotización. Te respondemos con precio por volumen y tiempos de entrega.'} />
                    <section className="max-w-7xl mx-auto px-4 md:px-8 py-12">
                        <div className="flex flex-col gap-4 mb-12 pb-6 border-b border-navy-line">
                            <div className="flex gap-2 overflow-x-auto no-scrollbar" role="group" aria-label="Línea">
                                <button className={chip(line === 'all')} aria-pressed={line === 'all'} onClick={() => { setLine('all'); setType('all'); }}>Dama y caballero</button>
                                {catalog.lines.map(l => <button key={l.id} className={chip(line === l.id)} aria-pressed={line === l.id} onClick={() => { setLine(l.id); setType('all'); }}>{l.label}</button>)}
                            </div>
                            <div className="flex flex-col md:flex-row gap-3 md:items-center justify-between">
                                <div className="flex gap-2 overflow-x-auto no-scrollbar" role="group" aria-label="Tipo de prenda">
                                    <button className={chip(type === 'all')} aria-pressed={type === 'all'} onClick={() => setType('all')}>Todo</button>
                                    {types.map(t => <button key={t.id} className={chip(type === t.id)} aria-pressed={type === t.id} onClick={() => setType(t.id)}>{t.label}</button>)}
                                </div>
                                <select className="field !w-auto !py-2 text-sm" value={fabric} onChange={e => setFabric(e.target.value)} aria-label="Tela">
                                    <option value="all">Todas las telas</option>
                                    {catalog.fabrics.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                </select>
                            </div>
                        </div>
                        {catalog.status === 'loading' && <GridSkeleton n={8} />}
                        {catalog.status === 'error' && <LoadError />}
                        {catalog.status === 'ready' && garments.length === 0 && <p className="text-center text-navy-400 py-12">No hay prendas con estos filtros.</p>}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-12">
                            {garments.map(g => <GarmentCard key={g.id} garment={g} catalog={catalog} />)}
                        </div>
                    </section>
                    <section className="max-w-4xl mx-auto px-4 md:px-8 py-10 text-center">
                        <h2 className="text-3xl">¿Buscas un diseño especial?</h2>
                        <p className="text-navy-500 mt-3">Desarrollamos prendas con la imagen de tu empresa: colores institucionales, bordado y cortes propios.</p>
                        <a href="/pages/contacto/?asunto=diseno" className="btn btn-line mt-6">Hablar con un asesor</a>
                    </section>
                </>
            );
        };

        renderPage(CollectionsPage);
    </script>
</body>
</html>
