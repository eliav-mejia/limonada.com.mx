<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de privacidad · Limonada</title>
    <meta name="description" content="Aviso de privacidad de Limonada conforme a la LFPDPPP.">
    <link rel="canonical" href="https://limonada.com.mx/pages/privacidad/">
    <meta property="og:title" content="Aviso de privacidad · Limonada">
    <meta property="og:description" content="Aviso de privacidad de Limonada conforme a la LFPDPPP.">
    <meta property="og:url" content="https://limonada.com.mx/pages/privacidad/">
    <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#171614">

    <!-- arranque.js first: sets LI_ROOT for every link and shows a message instead of a blank page if loading fails -->
    <script src="../../js/arranque.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>
    <noscript><p style="padding:2rem;font-family:sans-serif">Limonada necesita JavaScript para mostrar la tienda. Escríbenos a hola@limonada.com.mx.</p></noscript>

    <script type="text/babel" src="../../js/layout.jsx"></script>
    <script type="text/babel">
        // Values in [corchetes] are placeholders, highlighted until filled in. Pending legal review.
        const Mark = ({ children }) => String(children).split(/(\[[^\]]+\])/g).map((p, i) => p.startsWith('[') ? <mark key={i} className="bg-lemon px-1 rounded">{p}</mark> : p);
        const LegalPage = ({ kicker, title, mark, updated, sections }) => (
            <>
                <PageHero kicker={kicker} title={title} mark={mark} intro={`Última actualización: ${updated}`} />
                <section className="max-w-6xl mx-auto px-4 md:px-8 py-14 grid md:grid-cols-4 gap-12">
                    <nav className="hidden md:block md:sticky md:top-28 self-start text-sm space-y-3 mono" aria-label="Índice">
                        {sections.map(s => <a key={s.id} href={`#${s.id}`} className="block text-ink-2 hover:text-ink">{s.title}</a>)}
                    </nav>
                    <div className="md:col-span-3 space-y-12">
                        {sections.map(s => (
                            <article key={s.id} id={s.id} className="scroll-mt-28">
                                <h2 className="text-3xl mb-3">{s.title}</h2>
                                <div className="space-y-3 text-ink-2 leading-relaxed">{s.body.map((p, i) => <p key={i}><Mark>{p}</Mark></p>)}</div>
                            </article>
                        ))}
                    </div>
                </section>
            </>
        );

        const SECTIONS = [
            { id: 'responsable', title: 'Responsable', body: [`[Razón social] («${BRAND.name}»), con domicilio en ${BRAND.address}, es responsable del tratamiento de tus datos conforme a la Ley Federal de Protección de Datos Personales en Posesión de los Particulares (LFPDPPP).`] },
            { id: 'datos', title: 'Datos que recabamos', body: [
                'De contacto: nombre, email, teléfono, ciudad y, si nos la das, la fecha de tu evento.',
                'Medidas corporales, solo para confeccionar tu traje. Las guardamos con tu patrón para pedidos futuros; puedes pedir que las borremos en cualquier momento.',
                'No recabamos datos de tarjeta: el pago se hace en la página segura del procesador de pagos.' ] },
            { id: 'finalidades', title: 'Finalidades', body: [
                'Primarias: atender tu pedido, agendar citas, confeccionar y entregar tu traje, y atender garantías.',
                'Secundarias (puedes oponerte): avisarte de telas y colecciones nuevas. Escríbenos a ' + BRAND.email + ' si no deseas recibirlas.' ] },
            { id: 'transferencias', title: 'Encargados', body: ['Compartimos los datos necesarios con la paquetería y el procesador de pagos. No vendemos tus datos. [Lista de encargados por confirmar.]'] },
            { id: 'arco', title: 'Derechos ARCO', body: ['Puedes acceder, rectificar, cancelar u oponerte al tratamiento de tus datos escribiendo a ' + BRAND.email + '. Respondemos en un máximo de 20 días hábiles.'] },
            { id: 'almacenamiento', title: 'Almacenamiento local', body: ['El sitio guarda en tu navegador tu carrito, tus datos de contacto para no volver a escribirlos y tu elección de cookies. Tus medidas no se guardan en el navegador: solo viajan en el mensaje del pedido. Las cookies de medición solo se activan si eliges «Aceptar».'] },
        ];
        renderPage(() => <LegalPage kicker="Legal · México" title="Aviso de" mark="privacidad" updated="11 de octubre de 2026" sections={SECTIONS} />);
    </script>
</body>
</html>
